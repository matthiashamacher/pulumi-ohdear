name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: pulumi/setup-pulumi@v2
      - run: go vet ./...
      - run: go test ./...
      - run: make build
      - name: Schema is up to date
        # `version` is derived from `git describe` and legitimately differs
        # between a developer's checkout and CI's, so it's excluded here -
        # only real schema drift (resources, types, config) should fail this.
        run: |
          jq 'del(.version)' schema.json > /tmp/schema.committed.json
          make schema
          jq 'del(.version)' schema.json > /tmp/schema.generated.json
          diff -u /tmp/schema.committed.json /tmp/schema.generated.json
