name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: pulumi/setup-pulumi@v2
      - run: go vet ./...
      - run: go test ./...
      - run: make build
      - name: Schema is up to date
        run: |
          make schema
          git diff --exit-code -- schema.json
