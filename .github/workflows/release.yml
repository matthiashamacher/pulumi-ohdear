name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  # Cross-compiles the plugin and attaches the tar.gz archives to the GitHub
  # Release. The github:// pluginDownloadURL in schema.json resolves to these.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Generates the language SDKs from schema.json and publishes them.
  # Add python,dotnet,java to `sdk:` once the matching secrets are set.
  sdk:
    runs-on: ubuntu-latest
    needs: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: pulumi/setup-pulumi@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Generate SDKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-X github.com/matthiashamacher/pulumi-ohdear/provider.Version=${VERSION}" \
            -o bin/pulumi-resource-ohdear ./provider/cmd/pulumi-resource-ohdear
          pulumi package gen-sdk ./bin/pulumi-resource-ohdear --language nodejs -o sdk
      - name: Publish SDKs
        uses: pulumi/pulumi-package-publisher@v0
        with:
          sdk: nodejs
          version: ${{ github.ref_name }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
