name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  # Cross-compiles the plugin and attaches the tar.gz archives to the GitHub
  # Release. The github:// pluginDownloadURL in schema.json resolves to these.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Generates the Node.js SDK from the schema and publishes it to npm.
  sdk-nodejs:
    runs-on: ubuntu-latest
    needs: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: pulumi/setup-pulumi@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Generate and build the Node.js SDK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-X github.com/matthiashamacher/pulumi-ohdear/provider.Version=${VERSION}" \
            -o bin/pulumi-resource-ohdear ./provider/cmd/pulumi-resource-ohdear
          pulumi package gen-sdk ./bin/pulumi-resource-ohdear --language nodejs -o sdk
          cd sdk/nodejs
          npm install
          npm run build
          # tsc compiles into bin/; publish that with the manifest alongside it.
          cp package.json README.md bin/
      - name: Publish to npm
        run: npm publish --access public
        working-directory: sdk/nodejs/bin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Generates the Python SDK from the schema and publishes it to PyPI.
  sdk-python:
    runs-on: ubuntu-latest
    needs: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: pulumi/setup-pulumi@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and build the Python SDK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-X github.com/matthiashamacher/pulumi-ohdear/provider.Version=${VERSION}" \
            -o bin/pulumi-resource-ohdear ./provider/cmd/pulumi-resource-ohdear
          pulumi package gen-sdk ./bin/pulumi-resource-ohdear --language python -o sdk
          python -m pip install build twine
          cd sdk/python
          python -m build
      - name: Publish to PyPI
        run: python -m twine upload --non-interactive dist/*
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
