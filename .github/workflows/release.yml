name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  # Cross-compiles the plugin and attaches the tar.gz archives to the GitHub
  # Release. The github:// pluginDownloadURL in schema.json resolves to these.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Generates every language SDK from the schema, builds each into the on-disk
  # layout pulumi/pulumi-package-publisher expects, and uploads them as the
  # <lang>-sdk.tar.gz artifacts the publisher downloads.
  build-sdks:
    runs-on: ubuntu-latest
    needs: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: pulumi/setup-pulumi@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build provider binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-X github.com/matthiashamacher/pulumi-ohdear/provider.Version=${VERSION}" \
            -o bin/pulumi-resource-ohdear ./provider/cmd/pulumi-resource-ohdear

      - name: Generate SDKs
        run: |
          for lang in nodejs python dotnet java; do
            pulumi package gen-sdk ./bin/pulumi-resource-ohdear --language "$lang" -o sdk
          done

      - name: Build Node.js SDK
        run: |
          cd sdk/nodejs
          npm install
          npm run build
          cp package.json README.md bin/
          tar -zcf "${GITHUB_WORKSPACE}/nodejs.tar.gz" -C . .

      - name: Build Python SDK
        run: |
          python -m pip install build
          python -m build sdk/python --outdir sdk/python/bin/dist
          tar -zcf "${GITHUB_WORKSPACE}/python.tar.gz" -C sdk/python .

      - name: Build .NET SDK
        run: |
          # The csproj sets GeneratePackageOnBuild, so build drops the .nupkg
          # into bin/Debug/ where the publisher looks; `dotnet pack` double-runs
          # packaging and trips NU5026.
          dotnet build sdk/dotnet -c Debug
          tar -zcf "${GITHUB_WORKSPACE}/dotnet.tar.gz" -C sdk/dotnet .

      # ponytail: Java is generated but not yet published. Bare pulumi-java-gen
      # emits a malformed `com.matthiashamacher.` group and an empty POM
      # name/developers block that Sonatype Central rejects; enabling Java means
      # patching build.gradle and testing against a real staging repo. Do that as
      # a focused follow-up, then add `java` back to the publisher's `sdk` list.
      - name: Build Java SDK
        run: |
          sed -i 's#"com\.matthiashamacher\."#"io.github.matthiashamacher"#g' sdk/java/build.gradle
          tar -zcf "${GITHUB_WORKSPACE}/java.tar.gz" -C sdk/java .

      - uses: actions/upload-artifact@v4
        with:
          name: nodejs-sdk.tar.gz
          path: nodejs.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk.tar.gz
          path: python.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk.tar.gz
          path: dotnet.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: java-sdk.tar.gz
          path: java.tar.gz

  publish-sdks:
    runs-on: ubuntu-latest
    needs: build-sdks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: pulumi/setup-pulumi@v2
      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@v1
        with:
          repo: pulumi/pulumictl
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Publish SDKs
        uses: pulumi/pulumi-package-publisher@v0.0.23
        with:
          sdk: "all,!java"
          version: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NUGET_PUBLISH_KEY: ${{ secrets.NUGET_PUBLISH_KEY }}
          # An API token authenticates as the literal user __token__.
          PYPI_USERNAME: __token__
          PYPI_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          # For when java is re-enabled: pulumi-java-gen's build.gradle reads
          # PUBLISH_REPO_USERNAME/PASSWORD, not OSSRH_*.
          PUBLISH_REPO_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          PUBLISH_REPO_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.JAVA_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.JAVA_SIGNING_PASSWORD }}
